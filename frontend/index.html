<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Celestea Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0f12'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1.2' fill='none' stroke='%237f93b0' stroke-width='1.4'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">

    <!-- ===================== 顶栏 ===================== -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo" aria-hidden="true"><span></span></span>
        <span class="brand">Celestea Studio</span>
        <span class="brand-tag">v2 · TS</span>
      </div>
      <div class="topbar-right">
        <span id="modelChip" class="chip" title="模型">—</span>
        <button id="btnTheme" class="btn btn-quiet btn-theme" title="切换主题（夜航黑 / 樱花粉 / 克莱因蓝）">夜航</button>
        <button id="btnSidebar" class="btn btn-quiet" title="收起/展开左侧面板">收起</button>
        <button id="btnConfig" class="btn btn-quiet" title="运行配置（热调 model/推理档位/密钥等）">配置</button>
      </div>
    </header>

    <!-- ===================== 主体 ===================== -->
    <div id="layout">

      <!-- ---------- 左侧面板 ---------- -->
      <aside id="sidebar">

        <section class="side-sec" id="sec-tools">
          <header class="side-sec-head">
            <h3>工具</h3>
            <span class="sec-note" id="toolCount">…</span>
            <button class="btn-mini" id="btnReloadTools" title="重新加载工具清单">刷新</button>
          </header>
          <div class="side-body" id="toolList"><div class="side-note">加载中…</div></div>
        </section>

        <section class="side-sec" id="sec-sessions">
          <header class="side-sec-head">
            <h3>会话</h3>
            <span class="sec-note" id="sessionCount">…</span>
            <button class="btn-mini" id="btnClearSess" title="清空当前会话">清空</button>
          </header>
          <div class="side-body" id="sessionList"><div class="side-note">加载中…</div></div>
        </section>

        <section class="side-sec side-sec-foot">
          <div class="side-note" id="sideFoot">—</div>
        </section>
      </aside>

      <!-- ---------- 侧栏/主区分隔条（可拖动调宽 · 双击复位） ---------- -->
      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" title="拖动调整侧栏宽度 · 双击复位"></div>

      <!-- ---------- 主区 ---------- -->
      <main id="main">
        <div id="messages" tabindex="-1">
          <div id="emptyHint" class="empty-hint">
            <div class="empty-mark">◇</div>
            <div class="empty-title">Celestea Studio</div>
            <div class="empty-sub">在下方输入消息开始对话 · Enter 发送 · Shift+Enter 换行</div>
          </div>
        </div>

        <!-- ---------- statusline（模型 / 上下文环 / 吞吐，发送栏正上方） ---------- -->
        <div id="statusline" class="statusline" title="上下文化用 · 模型 · 思考强度 · 吞吐（GET /api/status + SSE 增量）">
          <div class="sl-row sl-row-main">
            <span class="sl-ring" id="slRing" title="上下文占用">
              <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
                <circle class="sl-ring-track" cx="7" cy="7" r="5.2" transform="rotate(-90 7 7)"></circle>
                <circle class="sl-ring-prog" cx="7" cy="7" r="5.2" transform="rotate(-90 7 7)"></circle>
              </svg>
            </span>
            <span class="sl-ctx" id="slCtx">—/—</span>
            <span class="sl-sep">·</span>
            <span class="sl-model" id="slModel" title="当前模型">—</span>
            <span class="sl-sep">·</span>
            <span class="sl-effort" id="slEffort" title="思考强度">—</span>
            <span class="sl-spacer"></span>
            <span class="sl-hint" id="slHint"></span>
          </div>
          <div class="sl-row sl-row-sub">
            <span class="sl-tps" id="slTps">— tok/s</span>
            <span class="sl-sep">·</span>
            <span class="sl-steps" id="slSteps">step —</span>
          </div>
        </div>

        <footer id="statusbar">
          <div class="sb-left">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
          </div>
          <div class="sb-right">
            <span id="statusTurn">turn —</span>
            <span class="sb-sep">·</span>
            <span id="statusStep">step —</span>
            <span class="sb-sep">·</span>
            <span id="statusTime">00:00</span>
          </div>
        </footer>

        <div id="inputbar">
          <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行" spellcheck="false"></textarea>
          <div class="input-side">
            <button id="btnCancel" class="btn btn-soft hidden">取消</button>
            <button id="btnSend" class="btn btn-accent">发送</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===================== 配置弹层 ===================== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">运行配置</h3>
        <div class="modal-actions">
          <button class="btn-mini" id="btnConfigReload" title="重新载入后端当前配置">重新载入</button>
          <button class="btn-mini" id="btnModalClose">关闭</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="configBody"><div class="side-note">加载中…</div></div>
        <div class="cfg-hintline" id="cfgHint"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
